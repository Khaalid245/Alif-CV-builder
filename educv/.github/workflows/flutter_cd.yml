name: Flutter CD (Continuous Deployment)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Envied Secrets
        run: dart run build_runner build --delete-conflicting-outputs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Build Android APK
        run: flutter build apk --release --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Upload Release Artifacts (APK)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: educv-release.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Artifacts (AAB)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/app/outputs/bundle/release/app-release.aab
          asset_name: educv-release.aab
          asset_content_type: application/x-authorware-bin
